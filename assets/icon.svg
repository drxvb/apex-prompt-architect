<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="APEX Prompt Architect">
  <title>APEX Prompt Architect</title>
  <desc>Deep indigo rounded square with a stylized A glyph at center, four phase markers in cardinal positions, and a blueprint grid backdrop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a55"/>
      <stop offset="1" stop-color="#0d122a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fffd4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#7fffd4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="url(#grid)"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>

  <g fill="#7fffd4" aria-hidden="true">
    <rect x="488" y="92" width="48" height="48" rx="6"/>
    <rect x="884" y="488" width="48" height="48" rx="6"/>
    <rect x="488" y="884" width="48" height="48" rx="6"/>
    <rect x="92" y="488" width="48" height="48" rx="6"/>
  </g>

  <g font-family="'SF Mono','Consolas','Roboto Mono',monospace" font-size="32" font-weight="600" fill="#7fffd4" fill-opacity="0.7" text-anchor="middle">
    <text x="512" y="80">D1</text>
    <text x="980" y="522">D2</text>
    <text x="512" y="980">D3</text>
    <text x="44" y="522">D4</text>
  </g>

  <circle cx="512" cy="512" r="300" fill="none" stroke="#7fffd4" stroke-width="3" stroke-opacity="0.32"/>
  <circle cx="512" cy="512" r="240" fill="none" stroke="#7fffd4" stroke-width="2" stroke-opacity="0.18"/>

  <g transform="translate(512 540)">
    <path d="M 0 -180 L -130 130 L -80 130 L -55 70 L 55 70 L 80 130 L 130 130 Z M -32 22 L 32 22 L 0 -52 Z"
          fill="#f5efe0" stroke="#7fffd4" stroke-width="2"/>
  </g>

  <text x="512" y="730"
        font-family="'SF Mono','Consolas','Roboto Mono',monospace"
        font-size="48" font-weight="700" letter-spacing="14"
        text-anchor="middle"
        fill="#7fffd4">APEX</text>

  <text x="512" y="790"
        font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif"
        font-size="32" font-weight="500" letter-spacing="6"
        text-anchor="middle"
        fill="#cfe5ec" fill-opacity="0.7">PROMPT · ARCHITECT</text>
</svg>
