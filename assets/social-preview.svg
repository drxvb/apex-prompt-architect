<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="APEX Prompt Architect banner">
  <title>APEX Prompt Architect — social preview</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a55"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.25" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7fffd4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7fffd4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <g transform="translate(320,320)">
    <circle cx="0" cy="0" r="174" fill="none" stroke="#7fffd4" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#7fffd4" stroke-width="1" stroke-opacity="0.2"/>

    <g fill="#7fffd4">
      <rect x="-12" y="-200" width="24" height="24" rx="4"/>
      <rect x="176" y="-12" width="24" height="24" rx="4"/>
      <rect x="-12" y="176" width="24" height="24" rx="4"/>
      <rect x="-200" y="-12" width="24" height="24" rx="4"/>
    </g>

    <g font-family="'SF Mono','Consolas',monospace" font-size="18" font-weight="600" fill="#7fffd4" fill-opacity="0.7" text-anchor="middle">
      <text x="0" y="-220">D1</text>
      <text x="232" y="6">D2</text>
      <text x="0" y="236">D3</text>
      <text x="-232" y="6">D4</text>
    </g>

    <path d="M 0 -100 L -75 80 L -45 80 L -32 42 L 32 42 L 45 80 L 75 80 Z M -18 12 L 18 12 L 0 -32 Z"
          fill="#f5efe0" stroke="#7fffd4" stroke-width="2" transform="translate(0,20)"/>
  </g>

  <g transform="translate(640,160)">
    <text x="0" y="0"
          font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif"
          font-size="60" font-weight="700"
          fill="#f5efe0">APEX Prompt</text>
    <text x="0" y="74"
          font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif"
          font-size="60" font-weight="700"
          fill="#f5efe0">Architect</text>

    <line x1="0" y1="118" x2="120" y2="118" stroke="#7fffd4" stroke-width="3"/>

    <text x="0" y="178"
          font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif"
          font-size="26" font-weight="500"
          fill="#cfe5ec">Rough prompt in. Production-grade,</text>
    <text x="0" y="214"
          font-family="'Inter','Segoe UI','Helvetica Neue',sans-serif"
          font-size="26" font-weight="500"
          fill="#cfe5ec">platform-aware prompt out.</text>

    <g transform="translate(0,272)" font-family="'SF Mono','Consolas',monospace" font-size="22" fill="#7fffd4">
      <text x="0" y="0">APEX 4D</text>
      <text x="135" y="0">·</text>
      <text x="155" y="0">10 prompts</text>
      <text x="320" y="0">·</text>
      <text x="340" y="0">12-pt checklist</text>
    </g>

    <g transform="translate(0,322)" font-family="'SF Mono','Consolas',monospace" font-size="22" fill="#cfe5ec" fill-opacity="0.75">
      <text x="0" y="0">Claude · Kimi · MiniMax · MIT</text>
    </g>
  </g>

  <text x="1240" y="612"
        font-family="'SF Mono','Consolas',monospace"
        font-size="20" font-weight="600"
        text-anchor="end"
        fill="#7fffd4" fill-opacity="0.7">v1.0.0</text>
</svg>
